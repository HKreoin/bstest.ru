services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bstest_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - bstest-network

  nginx:
    image: nginx:alpine
    container_name: bstest_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - bstest-network

  postgres:
    image: postgres:15-alpine
    container_name: bstest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bstest-network

networks:
  bstest-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

